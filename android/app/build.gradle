plugins { id 'com.android.application' }

android {
    namespace 'dev.tripoder.hooklab'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'dev.tripoder.hooklab'
        minSdk 28
        targetSdk 36
        versionCode 6
        versionName '0.6.0-preview'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // Local test distribution only; signing does not make this build debuggable.
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Copy the independently signed APK verbatim; do not merge its DEX or libraries into the host.
abstract class BundleGuest extends DefaultTask {
    @InputFile abstract RegularFileProperty getSourceApk()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @TaskAction void bundle() {
        def destination = outputDirectory.get().asFile
        destination.mkdirs()
        def bytes = sourceApk.get().asFile.bytes
        new File(destination, 'guest-fixture.apk').bytes = bytes
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        new File(destination, 'guest-fixture.sha256').text = sha + '\n'
    }
}
def bundleGuest = tasks.register('bundleGuest', BundleGuest) {
    dependsOn ':guest-fixture:assembleRelease'
    sourceApk.set(project(':guest-fixture').layout.buildDirectory.file('outputs/apk/release/guest-fixture-release.apk'))
    outputDirectory.set(layout.buildDirectory.dir('generated/guestAssets'))
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(bundleGuest) { it.outputDirectory }
}
